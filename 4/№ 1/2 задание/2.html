<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 2</title>
    <style>
        #buttons {
            display: flex;
            flex-direction: column;
            width: 150px;
            margin-top: 20px;
        }

        #buttons button {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h2 id="text">JavaScript Events</h2>

    <div id="buttons">
        <button ondblclick="changeColor('red')">Красный</button>
        <button ondblclick="changeColor('blue')">Синий</button>
        <button ondblclick="changeColor('green')">Зеленый</button>
        <button ondblclick="changeColor('orange')">Оранжевый</button>
    </div>

    <script>
        function changeColor(color) {
            const text = document.getElementById('text');
            text.style.color = color;
        }
    </script>
</body>
</html>
